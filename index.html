<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghibli Landscapes Interactive Gallery</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body onload="initializeGallery()">

  <h1>LANDSCAPE GALLERY</h1>

  <div id="image">
    Hover over or tab to an image below to display here.
  </div>

  <div class="preview-container">
    <img class="preview" 
         src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600" 
         alt="Tropical sunny beach with clear turquoise ocean water" 
         onmouseover="upDate(this)" 
         onmouseleave="unDo()" 
         onfocus="upDate(this)" 
         onblur="unDo()">

    <img class="preview" 
         src="https://images.unsplash.com/photo-1519681393784-d120267933ba?w=600" 
         alt="Snowy mountain peaks under a starlit night sky" 
         onmouseover="upDate(this)" 
         onmouseleave="unDo()" 
         onfocus="upDate(this)" 
         onblur="unDo()">

    <img class="preview" 
         src="https://images.unsplash.com/photo-1448375240586-882707db888b?w=600" 
         alt="Lush green forest filled with tall trees and golden sunlight" 
         onmouseover="upDate(this)" 
         onmouseleave="unDo()" 
         onfocus="upDate(this)" 
         onblur="unDo()">

    <img class="preview" 
         src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=600" 
         alt="Misty mountain valley during a serene sunrise" 
         onmouseover="upDate(this)" 
         onmouseleave="unDo()" 
         onfocus="upDate(this)" 
         onblur="unDo()">

    <img class="preview" 
         src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=600" 
         alt="Calm lake reflecting scenic mountain ranges at dusk" 
         onmouseover="upDate(this)" 
         onmouseleave="unDo()" 
         onfocus="upDate(this)" 
         onblur="unDo()">

    <img class="preview" 
         src="https://images.unsplash.com/photo-1426604966848-d7adac402bff?w=600" 
         alt="Vast grassy meadow under blue sky and white clouds" 
         onmouseover="upDate(this)" 
         onmouseleave="unDo()" 
         onfocus="upDate(this)" 
         onblur="unDo()">
  </div>

</body>
</html>
